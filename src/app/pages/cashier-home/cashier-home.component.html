<div class="cashier-shell">
  <div class="app-body">
    <main class="content vl-page-content">
      <div class="page-head">
        <div class="page-head-copy">
          <p class="eyebrow">Cashier Dashboard</p>
          <h1>Welcome back, {{ auth.currentUser()?.name || 'Cashier' }}</h1>
          <p class="subtitle">Manage the daily operations for your assigned shop.</p>
        </div>
      </div>

      <div class="card-grid">
        <button type="button" class="dash-card" *ngFor="let card of cards" (click)="navigateTo(card.route)">
          <span class="card-icon">
            <app-icon [name]="card.icon"></app-icon>
          </span>
          <span class="card-body">
            <span class="card-title">{{ card.title }}</span>
            <span class="card-desc">{{ card.desc }}</span>
          </span>
          <span class="card-chevron">
            <app-icon name="chevron-right"></app-icon>
          </span>
        </button>
      </div>

      <footer class="page-footer desktop-only">
        <span>VinoLedger &nbsp;|&nbsp; Smart Management for Wine Shops</span>
        <span>{{ today }}</span>
      </footer>
    </main>
  </div>

</div>
