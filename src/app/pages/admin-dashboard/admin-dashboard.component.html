<div class="admin-container vl-page-content">
  <section class="admin-page-title">
    <span class="console-label">Administration</span>
    <h1>Welcome back, <span class="admin-name">{{ userName }}</span></h1>
  </section>

  <section class="revenue-card">
    <div class="revenue-copy">
      <span class="eyebrow">TODAY AT A GLANCE</span>
      <h2>Total Revenue</h2>
      <div class="revenue-amount">{{ totalRevenueToday }}</div>
    </div>
    <div class="revenue-icon"><app-icon name="chart"></app-icon></div>
  </section>

  <div class="section-heading">
    <div><span class="eyebrow">CONTROL ROOM</span><h2>Administration</h2></div>
    <span class="section-note">{{ menuItems.length }} tools</span>
  </div>

  <section class="menu-grid">
    <button
      *ngFor="let item of menuItems"
      type="button"
      class="menu-item"
      (click)="navigateTo(item.route)">
      <span class="item-icon"><app-icon [name]="item.icon"></app-icon></span>
      <div class="item-label">{{ item.label }}</div>
      <app-icon class="item-chevron" name="chevron-right"></app-icon>
    </button>
  </section>

  <section class="quick-reports">
    <div class="section-heading"><div><span class="eyebrow">OPERATIONS</span><h2>Quick reports</h2></div></div>
    <div class="reports-grid">
      <article *ngFor="let report of quickReports" class="report-item">
        <span class="report-icon"><app-icon [name]="report.icon"></app-icon></span>
        <span class="report-label">{{ report.label }}</span>
      </article>
    </div>
  </section>

  <div class="app-footer">
    <p>VinoLedger Administration</p>
  </div>
</div>
