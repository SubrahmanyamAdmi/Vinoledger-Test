<main class="sheet-shell">
  <section class="content vl-page-content vl-page-content--compact">
    <div class="eyebrow">SHEET INITIALIZATION</div>
    <h1>Select shop & date</h1>

    <div class="identity">
      <div>
        <small>SHOP OWNER</small>
        <strong>{{ selectedShop.owner }}</strong>
      </div>
      <div>
        <small>SHOP ID</small>
        <strong>{{ selectedShop.id }}</strong>
      </div>
    </div>

    <div class="panel" *ngIf="!isLoadingDates; else loadingDates">
      <label for="shop-select">Select shop</label>
      <app-select id="shop-select" ariaLabel="Select shop" placeholder="Select shop ID" [options]="shopOptions" [(ngModel)]="selectedShopId" (ngModelChange)="onShopChange()"></app-select>

      <label for="date">Select sheet date</label>
      <app-date-input id="date" [min]="selectedShop.openingDate || null" [max]="today" [(ngModel)]="date" (ngModelChange)="dateChanged()" ariaLabel="Select sheet date"></app-date-input>

      <p *ngIf="dateError" class="date-error" role="alert">{{ dateError }}</p>
      <p>Opening a new sheet for this shop and date. Continue to daily sales entry to complete the sales record.</p>
    </div>

    <ng-template #loadingDates>
      <app-loader [overlay]="false" [title]="'Loading sheet dates for ' + (selectedShop.id || 'the selected shop') + '...'"></app-loader>
    </ng-template>

    <div class="actions">
      <button class="outline" [disabled]="isLoadingDates" (click)="open('/invoice')">＋ Add Invoice</button>
      <button class="primary" [disabled]="isLoadingDates" (click)="open('/daily-sales')">Proceed <span>→</span></button>
    </div>
  </section>

  <footer>SECURE SESSION ACTIVE</footer>
</main>
