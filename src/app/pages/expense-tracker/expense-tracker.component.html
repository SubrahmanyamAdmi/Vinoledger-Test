<app-topbar></app-topbar>
<app-sidenav>
  <div class="page-content">
    <h2>Expenses</h2>

    <div *ngIf="expenses?.length; else loading">
      <table class="expenses-table">
        <thead>
          <tr><th>ID</th><th>Date</th><th>Amount</th><th>Note</th></tr>
        </thead>
        <tbody>
          <tr *ngFor="let ex of expenses">
            <td>{{ex.id}}</td>
            <td>{{ex.date | date:'short'}}</td>
            <td>{{ex.amount}}</td>
            <td>{{ex.note}}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <ng-template #loading>
      <p>Loading expenses...</p>
    </ng-template>
  </div>
</app-sidenav>
