<div class="contact-shell">
  <header class="topbar">
    <div class="brand-block">
      <div class="brand-mark">VS</div>
      <div class="brand-copy">
        <span class="owner-name">{{ auth.currentUser()?.name || 'Shop Owner' }}</span>
        <span class="owner-role">Owner Dashboard</span>
      </div>
    </div>

    <button class="logout-btn" type="button" (click)="logout()" aria-label="Logout">↪</button>
  </header>

  <main class="content-wrap">
    <div class="page-title-row">
      <button class="back-btn" type="button" (click)="goBack()" aria-label="Back to dashboard">←</button>
      <div>
        <h1>Contact Admin</h1>
        <p class="subtitle">Reach the VinoLedger administration team</p>
      </div>
    </div>

    <section class="contact-list" aria-label="Admin contact information">
      <div class="contact-row">
        <span class="contact-icon" aria-hidden="true">●</span>
        <div>
          <span class="contact-label">Name</span>
          <strong>VinoLedger Admin Team</strong>
        </div>
      </div>

      <div class="contact-row">
        <span class="contact-icon" aria-hidden="true">☎</span>
        <div>
          <span class="contact-label">Phone Number</span>
          <a href="tel:+919876543210">+91 98765 43210</a>
        </div>
      </div>

      <div class="contact-row">
        <span class="contact-icon" aria-hidden="true">✉</span>
        <div>
          <span class="contact-label">Email</span>
          <a href="mailto:admin@vinoledger.com">admin&#64;vinoledger.com</a>
        </div>
      </div>

      <div class="contact-row">
        <span class="contact-icon" aria-hidden="true">⌂</span>
        <div>
          <span class="contact-label">Office Address</span>
          <strong>VinoLedger Office, MG Road,<br />Bengaluru, Karnataka 560001</strong>
        </div>
      </div>
    </section>
  </main>
</div>
