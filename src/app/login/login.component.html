<div class="login-shell">
  <div class="login-card">
    <div class="brand-block">
      <div class="brand-logo" aria-label="VinoLedger logo">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M34 8c4 0 6 3 6 7v5h2c6 0 9 5 9 10v1c0 13-9 23-21 25v6h6v3H20v-3h6v-6C14 54 5 44 5 31v-1c0-5 3-10 9-10h2v-5c0-4 2-7 6-7h12zm-9 12h12v-4a2 2 0 0 0-2-2H27a2 2 0 0 0-2 2v4zm-5 16c0 8 6 14 14 14s14-6 14-14c0-6-4-11-10-12v-1H30v1c-6 1-10 6-10 12zm12 6.5a4.5 4.5 0 0 1-4.5-4.5h9a4.5 4.5 0 0 1-4.5 4.5z" fill="currentColor"/>
        </svg>
      </div>

      <h1>VinoLedger</h1>
      <p>Manage Every Bottle, Sale and Transaction</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="error-banner" *ngIf="error">{{ error }}</div>

      <label class="field-label">Select your role</label>

      <div class="role-list" role="radiogroup" aria-label="Select your role">
        <button
          *ngFor="let role of roles"
          type="button"
          class="role-option"
          [class.selected]="selectedRole === role.value"
          (click)="selectRole(role.value)"
          [attr.aria-pressed]="selectedRole === role.value"
        >
          <span class="role-icon" [ngClass]="role.icon" aria-hidden="true">
            <svg *ngIf="role.icon === 'gear'" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.62.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.18l-2.39.96a6.9 6.9 0 0 0-1.63-.94L14.5 2.5a.5.5 0 0 0-.5-.5h-3.99a.5.5 0 0 0-.5.5l-.26 2.5c-.58.23-1.12.56-1.63.94l-2.39-.96a.5.5 0 0 0-.6.18L2.71 9.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.62-.06.94s.02.63.06.94L2.83 13.52a.5.5 0 0 0-.12.64l1.92 3.32c.13.23.4.32.6.18l2.39-.96c.51.38 1.05.71 1.63.94l.26 2.5c.04.28.25.5.5.5h3.99c.25 0 .46-.22.5-.5l.26-2.5c.58-.23 1.12-.56 1.63-.94l2.39.96c.2.14.47.05.6-.18l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5z" fill="currentColor"/></svg>
            <svg *ngIf="role.icon === 'building'" viewBox="0 0 24 24"><path d="M5 20V5.5A1.5 1.5 0 0 1 6.5 4H17.5A1.5 1.5 0 0 1 19 5.5V20h-2v-3H7v3H5zm2-8h2v2H7v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2zm-8-4h2v2H7V8zm4 0h2v2h-2V8zm4 0h2v2h-2V8z" fill="currentColor"/></svg>
            <svg *ngIf="role.icon === 'cash'" viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h13A2.5 2.5 0 0 1 21 7.5v9A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-9zm3 .5h12a1 1 0 0 1 1 1v1H5v-1a1 1 0 0 1 1-1zm-1 4h14v5.5a1 1 0 0 1-1 1h-12a1 1 0 0 1-1-1V12zm8 1.5a2 2 0 1 0 0 4 2 2 0 0 0 0-4z" fill="currentColor"/></svg>
          </span>
          <span class="role-copy">
            <span class="role-title">{{ role.title }}</span>
            <span class="role-subtitle">{{ role.subtitle }}</span>
          </span>
          <span class="role-check" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M9.55 16.2 5.3 11.95l1.4-1.4 2.85 2.85 7.75-7.75 1.4 1.4-9.15 9.15z" fill="currentColor"/></svg>
          </span>
        </button>
      </div>

      <div class="field-wrap">
        <label class="field-label">Email Address or User ID</label>
        <div class="input-shell">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11A2.5 2.5 0 0 1 17.5 20h-11A2.5 2.5 0 0 1 4 17.5v-11zm2.2-.5 6.8 5.2 6.8-5.2H6.2zm13.3 1.8-6.77 5.17a1 1 0 0 1-1.26 0L5.5 7.8v9.7c0 .28.22.5.5.5h12c.28 0 .5-.22.5-.5V7.8z" fill="currentColor"/></svg>
          </span>
          <input formControlName="email" type="text" placeholder="admin@vinoleger.com or SHOPID-OWNER" />
        </div>
      </div>

      <div class="field-wrap">
        <label class="field-label">Password</label>
        <div class="input-shell password-shell">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M17 9V7A5 5 0 0 0 7 7v2H5v11h14V9h-2zm-8 0V7a3 3 0 0 1 6 0v2H9zm7 2h2v7H6v-7h2v-1h8v1z" fill="currentColor"/></svg>
          </span>
          <input formControlName="password" [type]="showPassword ? 'text' : 'password'" placeholder="••••••••" />
          <button type="button" class="toggle-password" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'" [attr.aria-pressed]="showPassword" (click)="togglePasswordVisibility()">
            <svg viewBox="0 0 24 24"><path d="M12 5c5.2 0 9.6 3.95 10.8 9-1.2 5.05-5.6 9-10.8 9S2.4 19.05 1.2 14C2.4 8.95 6.8 5 12 5zm0 2.2c-4.1 0-7.55 2.92-8.56 6.8 1.01 3.88 4.46 6.8 8.56 6.8s7.55-2.92 8.56-6.8C19.55 10.12 16.1 7.2 12 7.2zm0 2.3a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z" fill="currentColor"/></svg>
          </button>
        </div>
      </div>

      <div class="secondary-row">
        <a href="#" class="forgot-link">Forgot Password?</a>
      </div>

      <button type="submit" class="submit-btn" [disabled]="loading">
        {{ loading ? 'Authenticating...' : 'Secure Login' }}
      </button>
    </form>

    <div class="footer-meta">
      <div class="version-row">System Version 2.4.0</div>
      <div class="security-row">
        <span class="security-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2 5 5v6c0 4.8 2.8 9.2 7 11 4.2-1.8 7-6.2 7-11V5l-7-3zm0 2.2 5 2.14v5.32c0 3.8-2.35 7.38-5 8.86-2.65-1.48-5-5.06-5-8.86V6.34l5-2.14zm-1 4.8h2v4h-2V9zm0 5h2v2h-2v-2z" fill="currentColor"/></svg>
        </span>
        <span>Enterprise Grade Security Enabled</span>
      </div>
    </div>
  </div>
</div>
